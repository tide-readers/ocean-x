<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- LLM-written: page title -->
  <title>KAI kit</title>
  <meta name="description" content="Interactive 3D model of the KAI learning kit.">
  <!-- Absolute paths, so the page works at both /digital-twin-kit and /digital-twin-kit/ -->
  <link rel="stylesheet" href="/digital-twin-kit/assets/style.css">
</head>
<body data-mode="kit">
  <header class="top">
    <!-- Product names from the deck "OceanX KAI Kit Orientation" -->
    <p class="brand">OCEANX</p>
    <h1>KAI</h1>
  </header>

  <main id="stage" aria-label="3D model of the KAI device">
    <canvas id="view"></canvas>

    <!-- LLM-written: loading message -->
    <p id="loading" class="status">Loading the kit…</p>

    <div id="fallback" hidden>
      <img data-src="/digital-twin-kit/assets/kit-reference.jpg" alt="The KAI device: four cream and orange modules clicked together, seen from the front and the side.">
      <!-- LLM-written: fallback message -->
      <p class="status">3D view isn't available on this device.</p>
    </div>

    <!-- Label panel. Names and lines come from the deck (see app.js); hints are LLM-written there. -->
    <aside id="label" class="label" hidden aria-live="polite">
      <h2 id="label-name"></h2>
      <p id="label-line"></p>
      <p id="label-hint" class="hint"></p>
      <!-- Lena's two options each turn; the button text is the line itself (see CONVERSATION in app.js). -->
      <div id="label-choices" class="choices"></div>
    </aside>

    <!-- Camera point of view (v2). Shown only in pov mode. Frame marks, REC dot and the orange wake light
         are drawn here in HTML; the wrapper and bins are 3D. Strings are LLM-written (see app.js UI). -->
    <div id="viewfinder" class="viewfinder" aria-live="polite">
      <div class="vf-dim"></div>
      <span class="vf-corner tl"></span><span class="vf-corner tr"></span>
      <span class="vf-corner bl"></span><span class="vf-corner br"></span>
      <span class="vf-light" aria-hidden="true"></span>
      <span class="vf-rec" aria-hidden="true"></span>
      <p id="vf-hint" class="vf-hint"></p>
      <div id="reaction" class="reaction" hidden>
        <p id="reaction-text"></p>
        <div class="reaction-actions">
          <!-- LLM-written: button labels -->
          <button type="button" id="btn-again">Try again</button>
          <button type="button" id="btn-back-reaction">Back to the kit</button>
        </div>
      </div>
    </div>
  </main>

  <nav id="bar" class="bar" aria-label="Kit controls">
    <!-- LLM-written: button labels. Which buttons show depends on body[data-mode] (kit, camera, pov).
         Swapping needs no button: while apart, tap a module, then tap another. -->
    <button type="button" id="btn-back" data-modes="camera pov">Back to the kit</button>
    <button type="button" id="btn-apart" data-modes="kit" disabled>Take apart</button>
    <button type="button" id="btn-reset" data-modes="kit camera" disabled>Reset view</button>
    <span class="gap" data-modes="kit camera" aria-hidden="true"></span>
    <button type="button" id="btn-camera" class="accent" data-modes="kit" disabled>See the camera</button>
    <button type="button" id="btn-try" class="accent" data-modes="camera">Try the camera</button>
  </nav>

  <!-- Interaction 5, "Listen". Three underwater recordings by the National Park Service, Glacier Bay,
       each trimmed to 16 s and normalised. License: US federal government works, public domain.
       1. humpback-glacier-bay.mp3: "Humpback whale moo etc", Bartlett Cove, 25 Sep 2001.
          https://home.nps.gov/glba/learn/nature/soundclips.htm
       2. killer-whales-glacier-bay.mp3: "Resident Killer Whale Vocalizations", NPS / C. Gabriele.
          https://www.nps.gov/nps-audiovideo/audiovideo/e60488c2-30fb-414b-bc9f-ee16f886a897.mp3
          (linked from the page above)
       3. harbor-seals-glacier-bay.mp3: "humpbacks and harbor seals in quiet 2020", 7 Aug 2020.
          https://home.nps.gov/glba/learn/nature/upload/HASE_in_quiet_2020Aug07_1631-2.mp3
       The src is set from the SOUNDS list in app.js. An <audio> element so the iPhone silent switch
       does not mute it the way it can mute Web Audio. -->
  <audio id="ocean" preload="none"></audio>

  <script>
    // If the module script never reports in (old browser, blocked WebGL), show the fallback.
    window.__kitReady = false;
    setTimeout(function () {
      if (!window.__kitReady) {
        document.getElementById('loading').hidden = true;
        var img = document.querySelector('#fallback img');
        if (!img.src) img.src = img.getAttribute('data-src');
        document.getElementById('fallback').hidden = false;
      }
    }, 8000);
  </script>
  <script type="module" src="/digital-twin-kit/assets/app.js"></script>
</body>
</html>
